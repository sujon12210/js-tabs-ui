<!DOCTYPE html>
<html>
<head>
  <title>Tabs UI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="tabs">
    <button onclick="show(1)">Tab 1</button>
    <button onclick="show(2)">Tab 2</button>
    <button onclick="show(3)">Tab 3</button>
  </div>

  <div class="content">
    <p id="c1">Content for Tab 1</p>
    <p id="c2">Content for Tab 2</p>
    <p id="c3">Content for Tab 3</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
